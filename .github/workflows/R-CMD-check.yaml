# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, development, LandWeb]
  pull_request:
    branches: [main, development]

name: R-CMD-check

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    uses: PredictiveEcology/actions/.github/workflows/R-CMD-check.yaml@main
    secrets: inherit
    with:
      ## BioSIM::getModelOutput is referenced by LandR but not exported by
      ## RNCan/BioSimClient_R — pre-existing WARNING tracked separately.
      ## Drop this override once that's resolved.
      error-on: '"error"'
      ## Take Suggests from DESCRIPTION rather than restating them here. The
      ## hand-maintained copy this replaces drifted: it silently stopped covering
      ## the vignette builder, and every leg failed to re-build the vignette.
      ## `TRUE` resolves this package's own Suggests plus hard dependencies
      ## transitively; it does NOT recurse into transitive Suggests, which is what
      ## previously hit a pak "dependency conflict" via tidyverse/ggplot2 through
      ## quickPlot's Remotes.
      dependencies: 'TRUE'
      ## Only the refs pak cannot resolve: `biomod2`/`BioSIM`/`map` are not on
      ## CRAN under those names (GitHub-only), so skip resolution here and install
      ## them via post-install below.
      extra-packages: |
        biomod2=?ignore
        BioSIM=?ignore
        map=?ignore
      post-install: |
        pak::pkg_install("remotes")
        remotes::install_github("RNCan/BioSimClient_R")
        remotes::install_github("CeresBarros/biomod2@dev_currentCeres")
        remotes::install_github("PredictiveEcology/map@development")
