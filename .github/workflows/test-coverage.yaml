# Thin caller — shared logic lives in PredictiveEcology/actions (reusable workflow).
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

name: test-coverage

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    uses: PredictiveEcology/actions/.github/workflows/test-coverage.yaml@main
    secrets: inherit
    with:
      ## See R-CMD-check.yaml for `dependencies: NA` rationale.
      dependencies: 'NA'
      extra-packages: |
        any::sf
        any::XML
        arrow
        bbmle
        covr
        curl
        digest
        dplyr
        fasterize
        future
        future.apply
        geodata
        ggalluvial
        ggpubr
        ggrepel
        googledrive
        httr
        knitr
        lqmm
        MASS
        memuse
        parallelly
        purrr
        qs2
        rasterVis
        RCurl
        RhpcBLASctl
        rlang
        rmarkdown
        roxygen2
        R.utils
        SpaDES.core
        spelling
        testthat
        withr
        biomod2=?ignore
        BioSIM=?ignore
        map=?ignore
      post-install: |
        pak::pkg_install("remotes")
        remotes::install_github("RNCan/BioSimClient_R")
        remotes::install_github("CeresBarros/biomod2@dev_currentCeres")
        remotes::install_github("PredictiveEcology/map@development")
